name: Publish Playwright Reports to GitHub Pages

on:
  workflow_run:
    workflows:
      - Playwright And Cucumber Tests
      - Playwright And Cucumber Tests (Docker)
    types:
      - completed

permissions:
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-reports
  cancel-in-progress: false

jobs:
  publish:
    name: Publish completed run's Allure report
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Select source artifact and report path
        id: source
        shell: bash
        env:
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          if [[ "$SOURCE_WORKFLOW" == *"(Docker)"* ]]; then
            echo "kind=docker" >> "$GITHUB_OUTPUT"
            echo "artifact=allure-report-docker-${SOURCE_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "kind=standard" >> "$GITHUB_OUTPUT"
            echo "artifact=allure-report-${SOURCE_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download source run's Allure report
        id: download-report
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.source.outputs.artifact }}
          path: published-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check downloaded report
        id: report-check
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f published-report/index.html ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Source workflow did not leave an Allure HTML report artifact; nothing to publish."
          fi

      - name: Upload report for GitHub Pages
        if: ${{ always() && steps.report-check.outputs.available == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./published-report

      - name: Deploy report to GitHub Pages
        id: deployment
        if: ${{ always() && steps.report-check.outputs.available == 'true' }}
        uses: actions/deploy-pages@v4

      - name: Publish report URL to summary
        if: ${{ always() && steps.report-check.outputs.available == 'true' }}
        shell: bash
        env:
          SOURCE_KIND: ${{ steps.source.outputs.kind }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          report_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "Latest report published at: ${report_url}"
          echo "## Allure report" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: ${SOURCE_KIND} run ${SOURCE_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the latest report](${report_url})" >> "$GITHUB_STEP_SUMMARY"