name: Publish Playwright Reports to GitHub Pages

on:
  # Automatic publishing is disabled. Re-enable by uncommenting the block below.
  # workflow_run:
  #   workflows:
  #     - Playwright And Cucumber Tests
  #     - Playwright And Cucumber Tests (Docker)
  #   types:
  #     - completed
  workflow_dispatch:

    inputs:
      source_run_id:
        description: GitHub Actions run ID that produced the report artifact.
        required: true
        type: string
      source_workflow:
        description: Source workflow name.
        required: true
        type: choice
        default: Playwright And Cucumber Tests
        options:
          - Playwright And Cucumber Tests
          - Playwright And Cucumber Tests (Docker)
      source_run_number:
        description: Source workflow run number used in the artifact name.
        required: true
        type: string

permissions:
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-reports
  cancel-in-progress: false

jobs:
  publish:
    name: Publish completed run's report bundle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Select source artifact and report path
        id: source
        shell: bash
        env:
          SOURCE_WORKFLOW: ${{ inputs.source_workflow }}
          SOURCE_RUN_NUMBER: ${{ inputs.source_run_number }}
        run: |
          if [[ "$SOURCE_WORKFLOW" == *"(Docker)"* ]]; then
            echo "kind=docker" >> "$GITHUB_OUTPUT"
            echo "artifact=allure-report-docker-${SOURCE_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "kind=standard" >> "$GITHUB_OUTPUT"
            echo "artifact=allure-report-${SOURCE_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download source run's report bundle
        id: download-report
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.source.outputs.artifact }}
          path: published-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}

      - name: Check downloaded report
        id: report-check
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f published-report/index.html ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Source workflow did not leave a report bundle with index.html; nothing to publish."
          fi

      - name: Upload report for GitHub Pages
        if: ${{ always() && steps.report-check.outputs.available == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./published-report

      - name: Deploy report to GitHub Pages
        id: deployment
        if: ${{ always() && steps.report-check.outputs.available == 'true' }}
        uses: actions/deploy-pages@v4

      - name: Publish report URL to summary
        if: ${{ always() && steps.report-check.outputs.available == 'true' }}
        shell: bash
        env:
          SOURCE_KIND: ${{ steps.source.outputs.kind }}
          SOURCE_RUN_NUMBER: ${{ inputs.source_run_number }}
        run: |
          report_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "Playwright report published at: ${report_url}"
          echo "## Published test reports" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: ${SOURCE_KIND} run ${SOURCE_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the latest Playwright report](${report_url})" >> "$GITHUB_STEP_SUMMARY"
